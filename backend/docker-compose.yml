services:

  rag-backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: enterprise-rag-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      # Persistent ChromaDB storage
      - ./chroma_storage:/app/chroma_storage

      # Uploaded PDFs
      - ./sample_documents:/app/sample_documents

      # Application logs
      - ./logs:/app/logs

      # HuggingFace model cache
      - huggingface_cache:/app/.cache/huggingface

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


volumes:
  huggingface_cache: